name: Build node-ish prototype

on:
  push:
    branches:
      - build/node-ish-prototype
    paths:
      - .github/workflows/node-ish-prototype.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Build Node 24 in native Alpine x86 chroot
        shell: bash
        run: |
          set -euxo pipefail
          NODE_VERSION=24.18.1
          ALPINE_VERSION=3.23.5
          ROOT="$RUNNER_TEMP/alpine-x86"
          OUT="$GITHUB_WORKSPACE/out"

          mkdir -p "$ROOT" "$OUT"
          curl -fL --retry 5 \
            "https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/x86/alpine-minirootfs-${ALPINE_VERSION}-x86.tar.gz" \
            -o "$RUNNER_TEMP/alpine-x86.tar.gz"
          sudo tar -xzf "$RUNNER_TEMP/alpine-x86.tar.gz" -C "$ROOT"

          sudo chroot "$ROOT" /bin/sh -c 'uname -m; /bin/busybox echo ia32-ok'

          sudo cp /etc/resolv.conf "$ROOT/etc/resolv.conf"
          sudo mkdir -p "$ROOT/proc" "$ROOT/sys" "$ROOT/dev" "$ROOT/out"
          sudo mount -t proc proc "$ROOT/proc"
          sudo mount --rbind /sys "$ROOT/sys"
          sudo mount --rbind /dev "$ROOT/dev"
          sudo mount --bind "$OUT" "$ROOT/out"

          cleanup() {
            sudo umount -l "$ROOT/out" || true
            sudo umount -l "$ROOT/dev" || true
            sudo umount -l "$ROOT/sys" || true
            sudo umount -l "$ROOT/proc" || true
          }
          trap cleanup EXIT

          sudo chroot "$ROOT" /bin/sh -euxc '
            apk add --no-cache \
              bash build-base clang lld python3 linux-headers curl ca-certificates \
              tar xz perl pkgconf git

            cd /tmp
            curl -fL --retry 5 \
              "https://nodejs.org/dist/v24.18.1/node-v24.18.1.tar.xz" \
              -o node.tar.xz
            tar -xf node.tar.xz
            cd node-v24.18.1

            python3 - <<"PY"
          from pathlib import Path
          p = Path("deps/uv/src/unix/linux.c")
          s = p.read_text()
          needle = "#if defined(__ANDROID_API__)\n"
          replacement = "#if defined(__i386__)\n  return 0;  /* iSH: no io_uring */\n#elif defined(__ANDROID_API__)\n"
          if needle not in s:
              raise SystemExit("libuv io_uring patch point not found")
          p.write_text(s.replace(needle, replacement, 1))
          PY

            grep -A8 "static int uv__use_io_uring" deps/uv/src/unix/linux.c

            export CC=clang
            export CXX=clang++
            export CFLAGS="-O1 -fno-omit-frame-pointer -march=i686 -mtune=generic"
            export CXXFLAGS="-O1 -fno-omit-frame-pointer -march=i686 -mtune=generic"
            export LDFLAGS="-fuse-ld=lld -Wl,--threads=1"

            ./configure \
              --dest-cpu=ia32 \
              --without-intl \
              --without-node-snapshot \
              --without-node-code-cache \
              --openssl-no-asm

            # Keep compile concurrency low so the final link has maximum headroom.
            make -j2

            NODE=out/Release/node
            "$NODE" --version
            "$NODE" -e "console.log({arch:process.arch,platform:process.platform})"
            "$NODE" --no-turbofan -e "let x=0; for(let i=0;i<1000000;i++) x+=i; console.log(x)"
            "$NODE" --no-turbofan -e "const fs=require(\"node:fs\"); fs.writeFileSync(\"/tmp/node-ish-test\",\"ok\"); console.log(fs.readFileSync(\"/tmp/node-ish-test\",\"utf8\"))"
            "$NODE" --no-turbofan -e "const {DatabaseSync}=require(\"node:sqlite\"); const db=new DatabaseSync(\":memory:\"); console.log(db.prepare(\"select 1 as ok\").get()); db.close()"

            mkdir -p /tmp/node-ish
            cp "$NODE" /tmp/node-ish/node
            chmod 0755 /tmp/node-ish/node
            strip /tmp/node-ish/node || true

            cd /tmp
            tar -czf /out/node-ish-24.18.1-alpine-i386.tar.gz node-ish
            sha256sum /out/node-ish-24.18.1-alpine-i386.tar.gz \
              > /out/node-ish-24.18.1-alpine-i386.tar.gz.sha256
          '

          ls -lh "$OUT"
          cat "$OUT/node-ish-24.18.1-alpine-i386.tar.gz.sha256"

      - name: Upload node-ish tarball
        uses: actions/upload-artifact@v4
        with:
          name: node-ish-24.18.1-alpine-i386
          path: |
            out/node-ish-24.18.1-alpine-i386.tar.gz
            out/node-ish-24.18.1-alpine-i386.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
